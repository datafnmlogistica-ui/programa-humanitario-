<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRO SEGURO</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #121212; /* Fondo oscuro elegante */
        }
        
        /* Contenedor seguro adaptativo */
        .contenedor-seguro {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Muestra el formulario en tamaño completo al 100% */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="contenedor-seguro">
        <!-- Tu URL de Google Apps Script completa -->
        <iframe src="https://script.google.com/macros/s/AKfycbxETKZ50Xhmd1xjbOFRnqJfd8n9rtD6llhZ3fYRsR9rDgUCY9XsbLlgQ_WwIIeItqqZ/exec"></iframe>
    </div>

</body>
</html>
